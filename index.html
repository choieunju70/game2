<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>키티 블록 · Game 02</title><link rel="stylesheet" href="style.css"></head><body><main><header><span>🎀 KITTY BLOCKS</span><small>GAME 02</small></header><section class="heading"><p>A LITTLE BREAK, A LOT OF CUTENESS</p><h1>키티 블록<span>차곡차곡 쌓는 작은 행복</span></h1></section><div class="layout"><section class="board-wrap"><canvas id="board" width="300" height="600" aria-label="테트리스 게임 보드"></canvas><div id="overlay"><div><span>🎀</span><h2 id="message">함께 놀아요!</h2><p id="description">키티 블록으로 가로줄을 채워주세요.</p><button id="play">게임 시작</button></div></div></section><aside><section class="card"><small>SCORE · 점수</small><strong id="score">0</strong><div class="stats"><div><small>LEVEL</small><b id="level">1</b></div><div><small>LINES</small><b id="lines">0</b></div></div></section><section class="card"><small>NEXT · 다음 블록</small><canvas id="next" width="150" height="120" aria-label="다음 블록"></canvas></section><section class="card record"><small>BEST · 최고 점수</small><b id="best">0</b></section><div class="actions"><button id="pause" disabled>일시정지</button><button id="restart">다시 시작</button></div><section class="guide"><h3>조작 방법</h3><p>← → &nbsp; 좌우 이동<br>↑ &nbsp; 블록 회전<br>↓ &nbsp; 빠르게 내리기<br>Space &nbsp; 바로 떨어뜨리기<br>P &nbsp; 일시정지</p></section></aside></div><nav class="touch" aria-label="터치 게임 조작"><button data-action="left" aria-label="왼쪽">←</button><button data-action="rotate" aria-label="회전">↻</button><button data-action="right" aria-label="오른쪽">→</button><button data-action="down" aria-label="아래로">↓</button><button data-action="drop">바로 내리기</button></nav><footer>MADE FOR YOUR HAPPY LITTLE MOMENTS ♡<br>팬 제작 게임 · 공식 Sanrio 제품이 아닙니다.</footer></main><script src="engine.js"></script><script src="game.js"></script></body></html>
